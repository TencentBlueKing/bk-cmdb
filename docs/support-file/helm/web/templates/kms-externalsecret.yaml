{{- if and .Values.kms.enabled .Values.kms.createResources }}
{{- $tls := .Values.kms.tls -}}
{{- if and $tls.enabled (or (and $tls.certFilename (not $tls.certKeyFilename)) (and $tls.certKeyFilename (not $tls.certFilename))) -}}
{{- fail "kms.tls.certFilename and kms.tls.certKeyFilename must be configured together" -}}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.kms.secretName }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: kms
spec:
  provider:
    vault:
      server: {{ .Values.kms.server | quote }}
      path: {{ .Values.kms.path | quote }}
      version: v2
      {{- if $tls.enabled }}
      {{- if $tls.certCAFilename }}
      caProvider:
        type: Secret
        name: {{ required "kms.tls.existingSecret is required" $tls.existingSecret | quote }}
        key: {{ $tls.certCAFilename | quote }}
      {{- end }}
      {{- if and $tls.certFilename $tls.certKeyFilename }}
      tls:
        certSecretRef:
          name: {{ required "kms.tls.existingSecret is required" $tls.existingSecret | quote }}
          key: {{ $tls.certFilename | quote }}
        keySecretRef:
          name: {{ $tls.existingSecret | quote }}
          key: {{ $tls.certKeyFilename | quote }}
      {{- end }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ .Values.kms.authMountPath | quote }}
          role: {{ .Values.kms.role | quote }}
          serviceAccountRef:
            name: {{ include "cmdb.serviceAccountName" . }}
            namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.kms.secretName }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: kms
spec:
  refreshInterval: {{ .Values.kms.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.kms.secretName }}
    kind: SecretStore
  target:
    name: {{ .Values.kms.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.kms.privateKeyKey }}
      remoteRef:
        key: {{ .Values.kms.credential | quote }}
        property: private_key
    - secretKey: {{ .Values.kms.envelopeKey }}
      remoteRef:
        key: {{ .Values.kms.credential | quote }}
        property: envelope
{{- end }}

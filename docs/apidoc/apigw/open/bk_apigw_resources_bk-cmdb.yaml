                      bk_set_id:
                        type: integer
                        description: 集群id
                      bk_bak_operator:
                        type: string
                        description: 备份维护人
                      bk_biz_id:
                        type: integer
                        description: 业务id
                      bk_module_type:
                        type: string
                        description: 模块类型
                      bk_parent_id:
                        type: integer
                        description: 父节点的ID
                      bk_supplier_account:
                        type: string
                        description: 开发商账号
                      last_time:
                        type: string
                        description: 更新时间
                      host_apply_enabled:
                        type: boolean
                        description: 是否启用主机属性自动应用
                      operator:
                        type: string
                        description: 主要维护人
                      service_category_id:
                        type: integer
                        description: 服务分类ID
                      service_template_id:
                        type: integer
                        description: 服务模版ID
                      set_template_id:
                        type: integer
                        description: 集群模板ID
                      bk_created_at:
                        type: string
                        description: 创建时间
                      bk_updated_at:
                        type: string
                        description: 更新时间
                      bk_created_by:
                        type: string

                  type: array
                  description: 集群查询条件 **bk_set_ids和set_cond只能使用其中一个**
                  items:
                    $ref: '#/components/schemas/CondItem'
                bk_module_ids:
                  type: array
                  items:
                    type: integer
                  description: 模块ID列表，最多500条 **bk_module_ids和module_cond只能使用其中一个**
                module_cond:
                  type: array
                  description: 模块查询条件 **bk_module_ids和module_cond只能使用其中一个**
                  items:
                    $ref: '#/components/schemas/CondItem'
                host_property_filter:
                  allOf:
                  - $ref: '#/components/schemas/PropertyFilter'
                  description: 主机属性组合查询条件
                fields:
                  type: array
                  items:
                    type: string
                  description: 主机属性列表，控制返回结果的主机里有哪些字段，能够加速接口请求和减少网络流量传输
              required:

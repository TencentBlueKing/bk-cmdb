  /api/v3/event/watch/resource/{bk_resource}:
    post:
      operationId: resource_watch
      description: 监听资源变化事件
      parameters:
      - name: bk_resource
        in: path
        required: true
        description: 要监听的资源类型，枚举值为：host, host_relation, biz, set, module, process, object_instance, mainline_instance, biz_set,
          biz_set_relation, plat, project。其中host代表主机详情事件，host_relation代表主机的关系事件，biz代表业务详情事件，set代表集群详情事件，module代表模块详情事件，process代表进程详情事件，object_instance代表通用模型实例事件，mainline_instance代表主线模型实例事件，biz_set代表业务集事件，biz_set_relation代表业务集和业务的关系事件,
          plat代表管控区域事件, project代表项目事件。
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bk_event_types:
                  type: array
                  items:
                    type: string
                  description: 事件类型，如果填了，即为只关注此类型的事件。可选的值为：create(新增)/update(更新)/delete(删除)。如，若使用create，则只关注该资源的新增事件。不填为空，则为关注所有。
                bk_fields:
                  type: array
                  items:
                    type: string
                  description: 返回的事件中需要返回的字段列表，目前监听主机资源该字段为必填字段，不能置空，主机关系可以置空。置空则默认为返回所有字段。
                bk_start_from:
                  type: string
                  description: 监听事件的起始时间，该值为unix time的秒数，即为从UTC1970年1月1日0时0分0秒起至你要watch的时间点的总秒数。
                bk_cursor:
                  type: string
                  description: 监听事件的游标，代表了要开始或者继续watch(监听)的事件地址，系统会返回这个游标的下一个、或一批事件。
                bk_supplier_account:
                  type: string
                  description: 开发商账号
                bk_filter:
                  type: object
                  properties:
                    bk_sub_resource:
                      type: string
                      description: 要监听的下级资源类型，仅支持bk_resource为object_instance或mainline_instance时使用，代表需要监听的模型的bk_obj_id
                  description: 过滤条件
              required:
              - bk_supplier_account
            example:
              bk_event_types:
              - create
              - update
              - delete
              bk_fields:
              - bk_host_innerip
              - bk_mac
              bk_start_from: 12345678999
              bk_cursor: MQ0yDTE1ODkyMDcyODENMQ01ZWI3ZWZjNTBiOTA5ZTYyMGFmYWQzZGY=
              bk_resource: host
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    description: 请求成功与否。true:请求成功；false请求失败
                    example: true
                  code:
                    type: integer
                    description: 错误编码。0表示success，>0表示失败错误
                    example: 0
                  message:
                    type: string
                    description: 请求失败返回的错误信息
                    example: success
                  permission:
                    type: object
                    nullable: true
                    description: 权限信息
                    additionalProperties: true
                  data:
                    type: object
                    properties:
                      bk_watched:
                        type: boolean
                        description: 是否监听到了事件，true：监听到了事件；false:未监听到事件
                      bk_events:
                        type: array
                        items:
                          type: object
                          properties:
                            bk_cursor:
                              type: string
                              description: 代表当前资源事件的游标值，调用方可以用该游标获取该事件后的下一个事件
                            bk_resource:
                              type: string
                              description: 该事件对应的资源类型
                            bk_event_type:
                              type: string
                              description: 该事件对应的事件类型，枚举值为：create(新增)/update(更新)/delete(删除)。
                            bk_detail:
                              type: object
                              additionalProperties: true
                              description: 该事件的对应的资源的详情数据，不同的资源，对应的详情不同。
                        description: 监听到的事件详情列表，最大长度为200，后续可能会调，请勿依赖此长度。
              example:
                result: true
                code: 0
                message: success
                permission: null
                data:
                  bk_watched: true
                  bk_events:
                  - bk_cursor: MQ0yDTE1ODkyMDcyODENMQ01ZWI3ZWZjNTBiOTA5ZTYyMGFmYWQzZGY=
                    bk_resource: host
                    bk_event_type: update
                    bk_detail:
                      bk_cpu: 2
                  - bk_cursor: MQ0yDTE1ODkzNDExMDcNMQ01ZWI3ZWZjNTBiOTA5ZTYyMGFmYWQzZGY=
                    bk_resource: host
                    bk_event_type: update
                    bk_detail:
                      bk_cpu: 2
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: true
        matchSubpath: false
        backend:
          type: HTTP
          method: post
          path: /api/v3/event/watch/resource/{bk_resource}
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        pluginConfigs:
        - type: bk-rate-limit
          yaml: |
            rates:
              __default:
              - period: 1
                tokens: 100
        authConfig:
          userVerifiedRequired: false
        disabledStages: []
        descriptionEn: Watch resource change event

                  description: 当创建的是自定义主线层级模型实例时则必传，代表父层级实例ID
              required:
              - bk_inst_name
              additionalProperties: true
              description: 除文档列出的系统内置字段外，还可包含模型自定义属性字段（具体字段以对应模型属性定义为准，勿将调用示例中的字段视为固定入参/出参）

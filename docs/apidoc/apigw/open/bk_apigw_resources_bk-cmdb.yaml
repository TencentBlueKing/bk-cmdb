        allowApplyPermission: true
        matchSubpath: false
        backend:
          type: HTTP
          method: put
          path: /api/v3/update/instance/object/{bk_obj_id}/inst/{bk_inst_id}
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        pluginConfigs:
        - type: bk-rate-limit
          yaml: |

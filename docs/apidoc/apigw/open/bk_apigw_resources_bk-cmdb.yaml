components:
  schemas:
    Page:
      type: object
      description: 分页条件
      required:
      - start
      - limit
      properties:
        start:
          type: integer
          description: 记录开始位置
          example: 0
        limit:
          type: integer
          description: 每页限制条数
          example: 10
        sort:
          type: string
          description: 排序字段，字段前加 - 表示降序，如 -field
          example: ''
        enable_count:
          type: boolean
          description: 是否返回总数
    FilterRule:
      type: object
      description: 属性过滤规则四元组
      required:
      - field
      - operator
      properties:
        field:
          type: string
          description: 字段名
        operator:
          type: string
          description: 操作符，可选值 equal,not_equal,in,not_in,less,less_or_equal,greater,greater_or_equal,between,not_between 等
        value:
          description: 操作数，不同 operator 对应不同 value 格式
          nullable: true
    PropertyFilter:
      type: object
      description: 属性组合查询条件，支持 AND/OR 嵌套
      properties:
        condition:
          type: string
          description: 聚合条件，如 AND / OR
          example: AND
        rules:
          type: array
          description: 规则列表，元素可为 FilterRule 或嵌套的 PropertyFilter
          items:
            type: object
            additionalProperties: true
            properties:
              field:
                type: string
                description: 字段名
              operator:
                type: string
                description: 操作符
              value:
                description: 操作数
                nullable: true
              condition:
                type: string
                description: 嵌套聚合条件
              rules:
                type: array
                description: 嵌套规则
                items:
                  $ref: '#/components/schemas/FilterRule'
    TimeConditionRule:
      type: object
      description: 时间查询条件规则
      properties:
        field:
          type: string
          description: 时间字段名
          example: create_time
        start:
          type: string
          description: 起始时间
          example: '2021-05-13 01:00:00'
        end:
          type: string
          description: 结束时间
          example: '2021-05-14 01:00:00'
    TimeCondition:
      type: object
      description: 按时间查询的条件
      required:
      - oper
      - rules
      properties:
        oper:
          type: string
          description: 操作符，目前只支持 and
          example: and
        rules:
          type: array
          description: 时间查询条件
          items:
            $ref: '#/components/schemas/TimeConditionRule'
    CondItem:
      type: object
      description: 简单字段条件（$eq/$ne 等）
      required:
      - field
      - operator
      - value
      properties:
        field:
          type: string
          description: 字段名
        operator:
          type: string
          description: 操作符，如 $eq、$ne
        value:
          description: 字段对应的值

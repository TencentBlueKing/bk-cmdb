  /api/v3/find/instassociation/object/{bk_obj_id}:
    post:
      operationId: search_inst
      description: 根据关联关系实例查询模型实例
      parameters:
      - name: bk_obj_id
        in: path
        required: true
        description: 模型ID
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  $ref: '#/components/schemas/Page'
                condition:
                  type: object
                  properties:
                    field:
                      type: string
                      description: 取值为模型的字段名
                    operator:
                      type: string
                      description: 取值为：$regex $eq $ne
                    value:
                      type: string
                      description: field配置的模型字段名所对应的值
                  required:
                  - field
                  - operator
                  - value
                  description: 具有关联关系的模型实例查询条件
                time_condition:
                  allOf:
                  - $ref: '#/components/schemas/TimeCondition'
                  description: 按时间查询模型实例的查询条件
                fields:
                  type: object
                  description: 指定查询模型实例返回的字段,key为模型ID，value为该查询模型要返回的模型属性字段
                  additionalProperties: true
              required:
              - page
            example:
              bk_obj_id: bk_switch
              page:
                start: 0
                limit: 10
                sort: bk_inst_id
              fields:
                bk_switch:
                - bk_asset_id
                - bk_inst_id
                - bk_inst_name
                - bk_obj_id
              condition:
                user:
                - field: operator
                  operator: $regex
                  value: admin
              time_condition:
                oper: and
                rules:
                - field: create_time
                  start: '2021-05-13 01:00:00'
                  end: '2021-05-14 01:00:00'
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    description: 请求成功与否。true:请求成功；false请求失败
                    example: true
                  code:
                    type: integer
                    description: 错误编码。0表示success，>0表示失败错误
                    example: 0
                  message:
                    type: string
                    description: 请求失败返回的错误信息
                    example: success
                  permission:
                    type: object
                    nullable: true
                    description: 权限信息
                    additionalProperties: true
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: 记录条数
                      info:
                        type: array
                        items:
                          type: string
                        description: 模型实例实际数据
              example:
                result: true
                code: 0
                message: success
                permission: null
                data:
                  count: 2
                  info:
                  - bk_asset_id: sw00001
                    bk_inst_id: 1
                    bk_inst_name: sw1
                    bk_obj_id: bk_switch
                  - bk_asset_id: sw00002
                    bk_inst_id: 2
                    bk_inst_name: sw2
                    bk_obj_id: bk_switch
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: true
        matchSubpath: false
        backend:
          type: HTTP
          method: post
          path: /api/v3/find/instassociation/object/{bk_obj_id}
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        pluginConfigs:
        - type: bk-rate-limit
          yaml: |
            rates:
              __default:
              - period: 1
                tokens: 100
        authConfig:
          userVerifiedRequired: false
        disabledStages: []
        descriptionEn: Search object instance based on the association relationship instance

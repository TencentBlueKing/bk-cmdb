openapi: 3.0.1
info:
  title: API Gateway Resources
  description: ""
  version: "0.1"
servers:
  - url: /
paths:
  /api/v3/biz/status/{flag}/{bk_supplier_account}/{bk_biz_id}:
    put:
      operationId: update_business_enable_status
      description: 修改业务启用状态
      parameters:
      - name: flag
        in: path
        required: true
        description: 启用状态，为disabled 或者enable
        schema:
          type: string
      - name: bk_supplier_account
        in: path
        required: true
        description: 参数在当前版本中已废弃，可传任意值
        schema:
          type: string
      - name: bk_biz_id
        in: path
        required: true
        description: 业务id
        schema:
          type: integer
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    description: 请求成功与否。true:请求成功；false请求失败
                    example: true
                  code:
                    type: integer
                    description: 错误编码。0表示success，>0表示失败错误
                    example: 0
                  message:
                    type: string
                    description: 请求失败返回的错误信息
                    example: success
                  permission:
                    type: object
                    nullable: true
                    description: 权限信息
                    additionalProperties: true
                  data:
                    type: object
                    additionalProperties: true
                    description: 请求返回的数据
              example:
                result: true
                code: 0
                message: success
                permission: null
                data: success
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: true
        matchSubpath: false
        backend:
          type: HTTP
          method: put
          path: /api/v3/biz/status/{flag}/{bk_supplier_account}/{bk_biz_id}
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        pluginConfigs:
        - type: bk-rate-limit
          yaml: |
            rates:
              __default:
              - period: 1
                tokens: 100
        authConfig:
          userVerifiedRequired: false
        disabledStages: []
        descriptionEn: Update business enable status
  /api/v3/set/{bk_biz_id}/batch:
    delete:
      operationId: batch_delete_set
      description: 批量删除集群
      parameters:
      - name: bk_biz_id
        in: path
        required: true
        description: 业务ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delete:
                  type: object
                  properties:
                    inst_ids:
                      type: array
                      items:
                        type: integer
                      description: 集群ID集合
                  required:
                  - inst_ids
                  description: 删除
              required:
              - delete
            example:
              bk_biz_id: 0
              delete:
                inst_ids:
                - 123
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    description: 请求成功与否。true:请求成功；false请求失败
                    example: true
                  code:
                    type: integer
                    description: 错误编码。0表示success，>0表示失败错误
                    example: 0
                  message:
                    type: string
                    description: 请求失败返回的错误信息
                    example: success
                  permission:
                    type: object
                    nullable: true
                    description: 权限信息
                    additionalProperties: true
                  data:
                    type: object
                    additionalProperties: true
                    description: 请求返回的数据
              example:
                result: true
                code: 0
                message: ''
                permission: null
                data: success
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: true
        matchSubpath: false
        backend:
          type: HTTP
          method: delete
          path: /api/v3/set/{bk_biz_id}/batch
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        pluginConfigs:
        - type: bk-rate-limit
          yaml: |
            rates:
              __default:
              - period: 1
                tokens: 100
        authConfig:
          userVerifiedRequired: false
        disabledStages: []
        descriptionEn: Batch delete set
  /api/v3/findmany/set/bk_biz_id/{bk_biz_id}:
    post:
      operationId: find_set_batch
      description: 批量查询某业务的集群详情
      parameters:
      - name: bk_biz_id
        in: path
        required: true
        description: 业务ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bk_ids:
                  type: array
                  items:
                    type: integer
                  description: 集群实例ID列表, 即bk_set_id列表，最多可填500个
                fields:
                  type: array
                  items:
                    type: string
                  description: 集群属性列表，控制返回结果的集群信息里有哪些字段
              required:
              - bk_ids
              - fields
              additionalProperties: true
              description: 除文档列出的系统内置字段外，还可包含模型自定义属性字段（具体字段以对应模型属性定义为准，勿将调用示例中的字段视为固定入参/出参）
            example:
              bk_biz_id: 3
              bk_ids:
              - 11
              - 12
              fields:
              - bk_set_id
              - bk_set_name
              - create_time
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    description: 请求成功与否。true:请求成功；false请求失败
                    example: true
                  code:
                    type: integer
                    description: 错误编码。0表示success，>0表示失败错误
                    example: 0
                  message:
                    type: string
                    description: 请求失败返回的错误信息
                    example: success
                  permission:
                    type: object
                    nullable: true
                    description: 权限信息
                    additionalProperties: true
                  data:
                    type: object
                    properties:
                      bk_set_name:
                        type: string
                        description: 集群名称
                      default:
                        type: integer
                        description: 0-普通集群，1-内置模块集合，默认为0
                      bk_biz_id:
                        type: integer
                        description: 业务id
                      bk_capacity:
                        type: integer
                        description: 设计容量
                      bk_parent_id:
                        type: integer
                        description: 父节点的ID
                      bk_set_id:
                        type: integer
                        description: 集群id
                      bk_service_status:
                        type: string
                        description: 服务状态:1/2(1:开放,2:关闭)
                      bk_set_desc:
                        type: string
                        description: 集群描述
                      bk_set_env:
                        type: string
                        description: 环境类型：1/2/3(1:测试,2:体验,3:正式)
                      create_time:
                        type: string
                        description: 创建时间
                      last_time:
                        type: string
                        description: 更新时间
                      bk_supplier_account:
                        type: string
                        description: 开发商账号
                      description:
                        type: string
                        description: 数据的描述信息
                      set_template_version:
                        type: array
                        items:
                          type: string
                        description: 集群模板的当前版本
                      set_template_id:
                        type: integer
                        description: 集群模板ID
                      bk_created_at:
                        type: string
                        description: 创建时间
                      bk_updated_at:
                        type: string
                        description: 更新时间
                    additionalProperties: true
                    description: 除文档列出的系统内置字段外，还可包含模型自定义属性字段（具体字段以对应模型属性定义为准，勿将调用示例中的字段视为固定入参/出参）
              example:
                result: true
                code: 0
                message: success
                permission: null
                data:
                - bk_set_id: 12
                  bk_set_name: ss1
                  create_time: '2020-05-15T22:15:51.67+08:00'
                  default: 0
                - bk_set_id: 11
                  bk_set_name: set1
                  create_time: '2020-05-12T21:04:36.644+08:00'
                  default: 0
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: true
        matchSubpath: false
        backend:
          type: HTTP
          method: post
          path: /api/v3/findmany/set/bk_biz_id/{bk_biz_id}
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        pluginConfigs:
        - type: bk-rate-limit
          yaml: |
            rates:
              __default:
              - period: 1
                tokens: 100
        authConfig:
          userVerifiedRequired: false
        disabledStages: []
        descriptionEn: Batch query the set details of a business
  /api/v3/findmany/module/bk_biz_id/{bk_biz_id}:

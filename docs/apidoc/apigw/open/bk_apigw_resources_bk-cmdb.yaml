                  create_time: '2020-05-12T21:04:47.286+08:00'
                  default: 0
                - bk_module_id: 58
                  bk_module_name: 待回收
                  create_time: '2020-05-12T21:03:37.238+08:00'
                  default: 3
                - bk_module_id: 57
                  bk_module_name: 故障机
                  create_time: '2020-05-12T21:03:37.183+08:00'
